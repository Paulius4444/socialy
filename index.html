<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Socialy</title>
<script>try{if(localStorage.getItem('socialy_theme')==='light')document.documentElement.classList.add('light')}catch(e){}</script>
<meta name="description" content="Socialy – bendruomeninių valandų valdymas mokykloje">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%230a0a0a%22/%3E%3Ccircle cx=%2224%22 cy=%2232%22 r=%2210%22 fill=%22%23FFD60A%22/%3E%3Ccircle cx=%2244%22 cy=%2232%22 r=%2210%22 fill=%22%233DDC84%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0a; --card:#141414; --card2:#1b1b1b; --line:#262626;
    --text:#f2f2f2; --muted:#8a8a8a;
    --y:#FFD60A; --g:#3DDC84; --r:#ff5c5c;
    --yt:#FFD60A; --gt:#3DDC84; --text2:#cfcfcf; --faint:#444; --faint2:#5a5a5a; --cs:dark; --b1:#fff; --b2:#d9d9d9; --shade:rgba(0,0,0,.7);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--text);font-family:'Space Grotesk',system-ui,sans-serif;font-size:16px;-webkit-font-smoothing:antialiased}
  body{min-height:100vh;transition:background .25s,color .25s}
  html.light{--bg:#ffffff;--card:#f5f5f2;--card2:#ebebe7;--line:#dcdcd6;--text:#121212;--muted:#6b6b6b;--r:#d23f3f;
    --yt:#946d00;--gt:#11804a;--text2:#3a3a3a;--faint:#c8c8c8;--faint2:#9b9b9b;--cs:light;--b1:#121212;--b2:#3a3a3a;--shade:rgba(0,0,0,.4)}
  .themebtn{background:none;border:1px solid var(--line);border-radius:8px;width:32px;height:28px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text);padding:0}
  .themebtn:hover{border-color:var(--yt);color:var(--yt)}
  .themebtn svg{width:16px;height:16px}
  .authtop{gap:8px;align-items:center}
  button,input,select,textarea{font:inherit;color:inherit}
  .wrap{max-width:760px;margin:0 auto;padding:28px 18px 80px}
  .brand{display:inline-flex;align-items:flex-end;gap:6px;font-weight:700;letter-spacing:-.05em;font-size:30px;line-height:1}
  .brand .w{background:linear-gradient(180deg,var(--b1) 0%,var(--b1) 60%,var(--b2) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
  .brand .w .y{color:var(--yt);-webkit-text-fill-color:var(--yt)}
  .brand .dots{display:inline-flex;gap:4px;margin-bottom:.14em}
  .brand .dots i{width:.22em;height:.22em;border-radius:50%;background:var(--y)}
  .brand .dots i+i{background:var(--g)}
  .brand.big{font-size:76px;gap:10px}
  .auth .tag{color:var(--gt);font-weight:600;font-size:15px;margin-top:10px;letter-spacing:.01em}
  .authtop{display:flex;justify-content:flex-end;margin-bottom:22px}
  .lang{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .lang button{background:none;border:0;color:var(--muted);font-size:12px;font-weight:700;padding:5px 8px;cursor:pointer;letter-spacing:.04em}
  .lang button.on{background:var(--text);color:var(--bg)}
  @media (max-width:520px){ .brand.big{font-size:60px} .brand{font-size:26px} }
  .y{color:var(--yt)} .g{color:var(--gt)} .r{color:var(--r)} .m{color:var(--muted)}

  /* AUTH */
  .auth{max-width:400px;margin:3vh auto 0}
  .auth h1{font-size:30px;line-height:1.1;letter-spacing:-.03em;margin:30px 0 8px}
  .auth p.sub{color:var(--muted);margin-bottom:24px}
  .seg{display:grid;grid-template-columns:1fr 1fr;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:18px}
  .seg button{background:none;border:0;padding:10px;border-radius:9px;cursor:pointer;color:var(--muted);font-weight:600}
  .seg button.on{background:var(--y);color:#000}
  label.f{display:block;margin-bottom:12px}
  label.f span{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
  input,select,textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;outline:none;transition:border-color .15s}
  input:focus,select:focus,textarea:focus{border-color:var(--y)}
  textarea{resize:vertical;min-height:80px}
  input[type=date],input[type=time]{color-scheme:var(--cs)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end}
  .roles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
  .roles button{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 10px;cursor:pointer;font-weight:600;text-align:center}
  .roles button small{display:block;font-weight:400;color:var(--muted);font-size:12px;margin-top:2px}
  .roles button.on.st{border-color:var(--y);color:var(--yt)}
  .roles button.on.te{border-color:var(--g);color:var(--gt)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer;transition:transform .08s,opacity .15s}
  .btn:active{transform:scale(.97)}
  .btn:disabled{opacity:.5;cursor:default}
  .btn.full{width:100%;padding:14px}
  .btn.y{background:var(--y);color:#000}
  .btn.g{background:var(--g);color:#000}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
  .btn.sm{padding:8px 12px;font-size:14px;border-radius:8px}
  .btn.out-g{background:transparent;border:1px solid var(--g);color:var(--gt)}
  .btn.out-r{background:transparent;border:1px solid var(--line);color:var(--muted)}
  .btn.out-r:hover{border-color:var(--r);color:var(--r)}
  .err{color:var(--r);font-size:14px;min-height:20px;margin:6px 0 10px}

  /* APP */
  header.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}
  .who{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end;font-size:14px;color:var(--muted)}
  .who b{color:var(--text);font-weight:600}
  .badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:99px}
  .badge.st{background:rgba(255,214,10,.12);color:var(--yt)}
  .badge.te{background:rgba(61,220,132,.12);color:var(--gt)}
  .linkbtn{background:none;border:0;color:var(--muted);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
  .linkbtn:hover{color:var(--text)}

  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:30px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
  .stat .n{font-size:34px;font-weight:700;letter-spacing:-.03em;line-height:1}
  .stat .l{font-size:13px;color:var(--muted);margin-top:6px}

  h2{font-size:14px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;margin:30px 0 12px;display:flex;align-items:center;justify-content:space-between}
  .list{display:grid;gap:10px}
  .job{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 16px 14px;position:relative}
  .job.mine{border-color:rgba(255,214,10,.45)}
  .job.done{border-color:rgba(61,220,132,.45)}
  .job .head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .job h3{font-size:18px;font-weight:600;letter-spacing:-.01em}
  .hrs{flex:none;font-weight:700;color:var(--gt);background:rgba(61,220,132,.1);border-radius:8px;padding:4px 10px;font-size:14px;white-space:nowrap}
  .meta{display:flex;flex-wrap:wrap;gap:6px 16px;margin:8px 0 10px;font-size:14px}
  .meta .y{font-weight:500}
  .task{color:var(--text2);font-size:15px;line-height:1.45;white-space:pre-wrap;margin-bottom:12px}
  .foot{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .foot .m{font-size:13px}
  .status{font-size:14px;font-weight:600}
  .empty{border:1px dashed var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--muted);font-size:15px}

  .ppl{border-top:1px solid var(--line);margin-top:12px;padding-top:10px;display:grid;gap:6px}
  .p{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:15px;padding:4px 0}
  .p .acts{display:flex;gap:6px}
  .p.ok .nm{color:var(--gt)}
  .past{opacity:.75}

  .newjob{background:var(--card);border:1px solid var(--g);border-radius:14px;padding:16px;margin-bottom:10px}
  .newjob h3{margin-bottom:14px;font-size:17px}
  .tbl{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .tbl .tr{display:flex;justify-content:space-between;padding:12px 16px;border-top:1px solid var(--line);font-size:15px}
  .tbl .tr:first-child{border-top:0}
  .note{font-size:13px;color:var(--muted);text-align:center;margin-top:30px;line-height:1.5}

  .cal{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
  .cal .ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .cal .ch b{font-size:17px;text-transform:capitalize}
  .cal .nav{background:none;border:1px solid var(--line);border-radius:8px;width:34px;height:34px;cursor:pointer;color:var(--text);font-size:16px}
  .cal .nav:hover{border-color:var(--y);color:var(--yt)}
  .cal .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .cal .wd{font-size:11px;color:var(--muted);text-align:center;padding:4px 0;text-transform:uppercase;letter-spacing:.05em}
  .cal .d{aspect-ratio:1/1;max-height:54px;border:1px solid transparent;border-radius:9px;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:15px;color:var(--text)}
  .cal .d:hover{background:var(--card2)}
  .cal .d.out{color:var(--faint)}
  .cal .d.past{color:var(--faint2)}
  .cal .d.today{border-color:var(--line);font-weight:700}
  .cal .d.sel{background:var(--y);color:#000;font-weight:700}
  .cal .dots{display:flex;gap:3px;height:6px}
  .cal .dots i{width:6px;height:6px;border-radius:50%;background:var(--y)}
  .cal .dots i.g{background:var(--g)}
  .cal .dots i.o{background:transparent;border:1.5px solid var(--y);width:6px;height:6px}
  .cal .d.sel .dots i{background:#000;border-color:#000}
  .cal .leg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
  .cal .leg span{display:inline-flex;align-items:center;gap:5px}
  .cal .leg i{width:12px;height:9px;border-radius:5px;background:var(--y);display:inline-block}
  .cal .leg i.g{background:var(--g)} .cal .leg i.o{background:none;border:1.5px solid var(--y)}

  .cal .dots i.r{background:var(--r)} .cal .leg i.r{background:var(--r)}
  .job.failed{border-color:rgba(255,92,92,.45)}
  .who2{font-size:14px;color:var(--text2);margin:-2px 0 12px}
  .p small{display:block;font-size:12px;margin-top:1px}
  .p.bad .nm{color:var(--r)}
  .relist{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:12px;padding:10px 12px;border:1px dashed rgba(255,214,10,.5);border-radius:10px;font-size:14px}
  .chatrow{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
  .chatbtn{background:none;border:0;color:var(--muted);cursor:pointer;font-size:14px;font-weight:600;padding:2px 0}
  .chatbtn:hover,.chatbtn.on{color:var(--text)}
  .cnt{display:inline-block;background:var(--y);color:#000;border-radius:99px;padding:1px 7px;font-size:11px;font-weight:700;margin-left:4px;vertical-align:1px}
  .chat{margin-top:8px}
  .msgs{max-height:280px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:4px 2px 8px}
  .msg{max-width:85%;background:var(--card2);border:1px solid var(--line);border-radius:12px 12px 12px 4px;padding:8px 11px;align-self:flex-start}
  .msg.me{align-self:flex-end;border-radius:12px 12px 4px 12px;border-color:rgba(255,214,10,.35);background:rgba(255,214,10,.06)}
  .msg .mh{display:flex;align-items:center;gap:6px;font-size:12px;margin-bottom:3px;flex-wrap:wrap}
  .msg .mh .badge{font-size:9px;padding:2px 6px}
  .msg .mt{font-size:15px;line-height:1.4;white-space:pre-wrap;word-wrap:break-word}
  .send{display:flex;gap:8px;margin-top:6px}
  .send input{padding:10px 12px}
  .notif{background:var(--card);border:1px solid var(--y);border-radius:14px;padding:12px 12px 8px;margin-bottom:22px}
  .notif .nh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px;padding:0 4px;font-size:15px}
  .notif .nh .linkbtn{font-size:13px}
  .ni{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:10px 4px;cursor:pointer;font-size:14px;line-height:1.4}
  .ni:hover{background:var(--card2)}
  .ni .t{flex:none;font-size:12px}

  /* ---- Feats / auth hero ---- */
  .feats{list-style:none;display:none;margin-top:36px;gap:14px}
  .feats li{display:flex;align-items:center;max-width:460px;line-height:1.35;gap:12px;font-size:17px;color:var(--text2)}
  .feats i{flex:none;font-style:normal;width:36px;height:36px;border-radius:10px;background:var(--card);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:16px}
  .main > h2:first-child, .main > .notif + h2{margin-top:0}
  .sideh{margin-top:26px}
  /* ---- Desktop ---- */
  @media (min-width:1000px){
    .wrap{max-width:1440px;padding:28px 40px 80px}
    .auth{max-width:1100px;margin:8vh auto 0;display:grid;grid-template-columns:1.15fr 1fr;gap:80px;align-items:center}
    .hero{padding-right:20px}
    .brand.big{font-size:132px;gap:14px}
    .auth .tag{font-size:22px;margin-top:18px}
    .feats{display:grid}
    .formside{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:30px 32px 32px}
    .formside h1{margin-top:0}
    .formside input{background:var(--bg)}
    .formside .seg,.formside .roles button{background:var(--bg)}
    .authtop{margin-bottom:10px}
    header.top{margin-bottom:32px}
    .brand{font-size:34px}
    .cols{display:grid;grid-template-columns:380px 1fr;gap:36px;align-items:start}
    .side{position:sticky;top:20px;max-height:calc(100vh - 40px);overflow-y:auto;padding-bottom:10px;scrollbar-width:thin}
    .side .stats{grid-template-columns:repeat(3,1fr);margin-bottom:14px}
    .side .stats .stat:last-child{grid-column:auto}
    .side .stat{padding:14px 12px}
    .side .stat .n{font-size:28px}
    .side .stat .l{font-size:12px}
    .main .list{grid-template-columns:repeat(auto-fill,minmax(400px,1fr));align-items:start;gap:14px}
    .main h2{margin-top:34px}
  }
  @media (min-width:1500px){ .cols{grid-template-columns:420px 1fr} }
  .note-box{border:1px solid var(--y);background:rgba(255,214,10,.07);color:var(--text);border-radius:10px;padding:12px 14px;font-size:14px;line-height:1.45;margin-bottom:16px}
  .note-box.ok{border-color:var(--g);background:rgba(61,220,132,.08)}
  .donebar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:-2px 0 10px;padding:8px 12px;border-radius:10px;background:rgba(61,220,132,.08);color:var(--gt);font-size:14px;font-weight:600}
  .modal-bg{position:fixed;inset:0;background:var(--shade);display:flex;align-items:center;justify-content:center;z-index:20;padding:20px;backdrop-filter:blur(3px)}
  .modal{background:var(--card);border:1px solid var(--g);border-radius:18px;padding:26px 24px 22px;max-width:420px;width:100%;text-align:center}
  .modal .mi{width:54px;height:54px;border-radius:50%;background:rgba(61,220,132,.15);color:var(--gt);font-size:26px;font-weight:700;display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
  .modal h3{font-size:22px;margin-bottom:10px}
  .modal p{font-size:15px;line-height:1.45;margin-bottom:6px}
  .att{margin:-2px 0 12px;display:flex;flex-direction:column;gap:8px}
  .thumbs{display:flex;gap:8px;flex-wrap:wrap}
  .thumbs a{display:block;width:96px;height:96px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--card2)}
  .thumbs img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .2s}
  .thumbs a:hover img{transform:scale(1.05)}
  .thumb-ph{width:96px;height:96px;border-radius:10px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:26px;color:var(--muted)}
  .fchip{display:flex;align-items:center;gap:8px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card2);color:var(--text);text-decoration:none;font-size:14px;max-width:100%}
  .fchip span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fchip small{color:var(--muted);flex:none}
  .fchip[href]:hover{border-color:var(--y)}
  .flabel{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
  div.f{margin-bottom:14px}
  .fadd{background:transparent;font-family:inherit;display:inline-flex;align-items:center;gap:6px;padding:10px 14px;border:1px dashed var(--line);border-radius:10px;cursor:pointer;font-size:14px;color:var(--text)}
  .fadd:hover{border-color:var(--g);color:var(--gt)}
  .fsel{display:flex;align-items:center;gap:8px;font-size:14px;padding:6px 2px}
  .fsel span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fhint{display:block;margin-top:6px;font-size:12px}
  .trow{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .trow input{flex:1}
  .trow .linkbtn{width:28px;text-decoration:none;font-size:15px}
  #timeList .trow:only-child [data-rmtime]{visibility:hidden}
  .slots{width:100%}
  .slots>.m{display:block;font-size:13px;margin-bottom:8px}
  .slotrow{display:flex;flex-wrap:wrap;gap:8px}
  .slot{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:78px;padding:8px 12px;border-radius:10px;border:1px solid var(--y);background:transparent;color:var(--text);cursor:pointer;font-family:inherit;transition:background .15s}
  .slot b{font-size:16px}
  .slot small{font-size:11px;color:var(--muted)}
  button.slot:hover{background:var(--y);color:#000}
  button.slot:hover small{color:#000}
  .slot.full{border-color:var(--line);opacity:.5;cursor:default}
  .slotsum{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--text2);margin:-4px 0 10px}
  .slotsum b{color:var(--text)}
  .collh{width:100%;display:flex;align-items:center;justify-content:space-between;background:none;border:0;border-top:1px solid var(--line);margin-top:22px;padding:14px 2px 10px;cursor:pointer;color:var(--muted);font:inherit;font-size:14px;text-transform:uppercase;letter-spacing:.08em;font-weight:600}
  .collh em{font-style:normal;background:var(--card2);color:var(--text);border-radius:99px;padding:1px 8px;margin-left:6px;font-size:12px;letter-spacing:0}
  .collh i{font-style:normal;font-size:22px;line-height:1;width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;border:1px solid var(--line);color:var(--text)}
  .collh:hover i{border-color:var(--yt);color:var(--yt)}
  .collh:hover{color:var(--text)}
  .statbtn{display:inline-flex;align-items:center;gap:6px;background:none;border:1px solid var(--line);border-radius:8px;height:28px;padding:0 10px;cursor:pointer;color:var(--text);font:inherit;font-size:13px;font-weight:600}
  .statbtn:hover{border-color:var(--yt);color:var(--yt)}
  .modal.statsm{max-width:460px;text-align:left;position:relative;border-color:var(--y)}
  .modal.statsm h3{margin-bottom:16px}
  .mclose{position:absolute;top:12px;right:14px;background:none;border:0;color:var(--muted);font-size:18px;cursor:pointer}
  .mclose:hover{color:var(--text)}
  .sgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}

  .donut small{font-size:11px;color:var(--muted)}

  .dleg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;background:var(--g)}
  .dleg i.r{background:var(--r)}

  .tabs button:not(.on):hover{color:var(--text)}

function errMsg(e){
  const m = String((e && (e.message || e.error_description || e.msg)) || e || '');
  if (/SOCIALY_BAD_TEACHER_CODE/.test(m)) return t('errCode');
  if (/SOCIALY_BAD_DOMAIN/.test(m)) return t('errDomain');
  if (/SOCIALY_FULL/.test(m)) return t('errFullDb');
  if (/SOCIALY_BAD_SLOT/.test(m)) return t('errSlot');
  if (/SOCIALY_OWN_POST/.test(m)) return t('errOwnPost');
  if (/SOCIALY_PAST/.test(m)) return t('errPast');
  if (/Invalid login credentials/i.test(m)) return t('errLogin');
  if (/Email not confirmed/i.test(m)) return t('notConfirmed');
  if (/already registered|already exists/i.test(m)) return t('errExists');
  if (/rate limit|too many/i.test(m)) return t('errRate');
  if (/Failed to fetch|NetworkError/i.test(m)) return t('errNet');
  if (/row-level security|permission/i.test(m)) return t('errPerm');
  return t('errSave');
}

}

async function onAuth(ev){
  ev.preventDefault();
  const f = new FormData(ev.target), err = $('#authErr'), btn = $('#authBtn');
  const email = (f.get('email')||'').trim().toLowerCase(), pass = f.get('pass')||'';
  err.textContent=''; S.authNote='';
  if (!CONFIGURED){ err.textContent = t('noConfig'); return }
  if (EMAIL_DOMAIN && email && S.authMode!=='recovery' && !email.endsWith('@' + EMAIL_DOMAIN)){ err.textContent = t('errDomain'); return }
  btn.disabled = true;
  try{
    if (S.authMode==='login'){
      await q(sb.auth.signInWithPassword({ email, password: pass }));
      // onAuthStateChange atidarys programą
    } else if (S.authMode==='signup'){
      if (pass.length<6){ err.textContent=t('errShort'); btn.disabled=false; return }
      const { data, error } = await sb.auth.signUp({ email, password: pass, options: {
        emailRedirectTo: REDIRECT,
        data: { first_name:(f.get('first')||'').trim(), last_name:(f.get('last')||'').trim(), role:S.role, teacher_code:(f.get('code')||'').trim() } } });
      if (error){ err.textContent = signupErr(error, S.role); btn.disabled=false; return }
      if (!data.session){
        // Supabase grąžina user be identities, jei el. paštas jau užregistruotas
        if (data.user && Array.isArray(data.user.identities) && data.user.identities.length === 0){ err.textContent=t('errExists'); btn.disabled=false; return }
        S.authMode='login'; S.authNote=t('checkEmail'); renderAuth(); return;
      }
      toast(t('created'));
    } else if (S.authMode==='forgot'){
      await q(sb.auth.resetPasswordForEmail(email, { redirectTo: REDIRECT }));
      S.authMode='login'; S.authNote=t('linkSent'); renderAuth(); return;
    } else if (S.authMode==='recovery'){
      if (pass.length<6){ err.textContent=t('errShort'); btn.disabled=false; return }
      await q(sb.auth.updateUser({ password: pass }));
      S.authMode='login'; toast(t('passSaved'));
      const { data:{ session } } = await sb.auth.getSession();
      if (session) return startSession(session.user);
      renderAuth(); return;
    }
  }catch(e){ err.textContent = errMsg(e); btn.disabled=false }
}

const BUCKET = 'job-files', MAX_FILES = 5, MAX_MB = 10;
const EXT_TYPES = { pdf:'application/pdf', doc:'application/msword', docx:'application/vnd.openxmlformats-officedocument.wordprocessingml.document',
  xls:'application/vnd.ms-excel', xlsx:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet', ppt:'application/vnd.ms-powerpoint',
  pptx:'application/vnd.openxmlformats-officedocument.presentationml.presentation', txt:'text/plain', jpg:'image/jpeg', jpeg:'image/jpeg', png:'image/png', webp:'image/webp', gif:'image/gif', heic:'image/heic' };
const fileType = f => f.type || EXT_TYPES[(f.name.split('.').pop()||'').toLowerCase()] || '';
const isImg = tp => /^image\/(jpeg|png|webp|gif)$/.test(tp||'');
const safeName = n => n.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9._-]+/g,'_').slice(-80) || 'failas';
const fmtSize = b => b > 1048576 ? (b/1048576).toFixed(1)+' MB' : Math.max(1,Math.round(b/1024))+' KB';
async function signFiles(){
  const now = Date.now();
  const need = [...new Set(S.jobs.flatMap(j => j.files.map(f => f.path)))].filter(p => !S.fileUrls[p] || S.fileUrls[p].exp < now + 600000);
  if (!need.length) return;
  try{
    const { data } = await sb.storage.from(BUCKET).createSignedUrls(need, 43200);
    (data||[]).forEach(d => { if (d && d.signedUrl) S.fileUrls[d.path] = { url:d.signedUrl, exp: now + 43200000 } });
  }catch(e){}
}
// Didelės nuotraukos sumažinamos iki 1600 px, kad greičiau kraustytųsi
async function shrinkImage(file){
  const tp = fileType(file);
  if (!/^image\/(jpeg|png|webp|heic)$/.test(tp) || file.size < 900000) return file;
  try{
    const bmp = await createImageBitmap(file);
    const k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width*k); c.height = Math.round(bmp.height*k);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.85));
    if (!blob || blob.size >= file.size) return file;
    return new File([blob], file.name.replace(/\.[^.]+$/, '') + '.jpg', { type:'image/jpeg' });
  }catch(e){ return file }
}
async function uploadFiles(files){
  const out = [];
  for (const raw of files){
    const f = await shrinkImage(raw), tp = fileType(f);
    const path = S.me.key + '/' + Date.now().toString(36) + Math.random().toString(36).slice(2,6) + '-' + safeName(f.name);
    const { error } = await sb.storage.from(BUCKET).upload(path, f, { contentType: tp, upsert:false });
    if (error) throw error;
    out.push({ path, name: f.name, type: tp, size: f.size });
  }
  return out;
}

  if (!j.files || !j.files.length) return '';
  const imgs = j.files.filter(f => isImg(f.type)), docs = j.files.filter(f => !isImg(f.type));

    ${imgs.length ? `<div class="thumbs">${imgs.map(f => u(f) ? `<a href="${esc(u(f))}" target="_blank" rel="noopener"><img src="${esc(u(f))}" alt="${esc(f.name)}" loading="lazy"></a>` : `<span class="thumb-ph">🖼</span>`).join('')}</div>` : ''}
    ${docs.map(f => `<a class="fchip" ${u(f)?`href="${esc(u(f))}" target="_blank" rel="noopener"`:''}>📄 <span>${esc(f.name)}</span><small>${fmtSize(f.size||0)}</small></a>`).join('')}
  </div>`;
}

let loading = null, again = false;
async function loadAll(){
  if (loading){ again = true; return loading }
  loading = (async () => {
    try{
      const since = plusDays(-365);
      const [jobs, signups, msgs] = await Promise.all([
        q(sb.from('jobs').select('*').gte('date', since).order('date')),
        q(sb.from('signups').select('*')),
        q(sb.from('messages').select('*').order('created_at').limit(5000))
      ]);
      S.jobs = jobs.map(mapJob); S.signups = signups.map(mapSignup); S.messages = msgs.map(mapMsg);
      if (S.me && S.me.role === 'teacher'){
        try{
          const [tp, to] = await Promise.all([
            q(sb.from('teacher_posts').select('*').order('created_at', { ascending:false }).limit(500)),
            q(sb.from('teacher_offers').select('*'))
          ]);
          S.tposts = tp.map(mapPost); S.toffers = to.map(mapOffer);
        }catch(e){ S.tposts = []; S.toffers = [] }
      }
      S.loaded = true;
      await signFiles();
      if (S.me){ checkNew(); renderApp() }
    }catch(e){ S.loaded = true; S.me && renderApp(); toast(errMsg(e)) }
  })();
  await loading; loading = null;
  if (again){ again = false; return loadAll() }
}
let reloadT;
function subscribe(){
  if (S.channel) return;
  const kick = () => { clearTimeout(reloadT); reloadT = setTimeout(loadAll, 250) };
  S.channel = sb.channel('socialy')
    .on('postgres_changes', { event:'*', schema:'public', table:'jobs' }, kick)
    .on('postgres_changes', { event:'*', schema:'public', table:'signups' }, kick)
    .on('postgres_changes', { event:'*', schema:'public', table:'messages' }, kick)
    .on('postgres_changes', { event:'*', schema:'public', table:'teacher_posts' }, kick)
    .on('postgres_changes', { event:'*', schema:'public', table:'teacher_offers' }, kick)
    .subscribe();
}

function ago(ts){
  const s = Math.max(0, (Date.now()-ts)/1000);
  if (s<60) return t('justNow');
  if (s<3600) return t('minAgo', Math.floor(s/60));
  if (s<86400) return t('hAgo', Math.floor(s/3600));
  return t('shortDate', new Date(ts), t('mon'));
}

/* --- Kalendorius --- */
function calendar(marksFor, legend){
  const now=new Date();
  if(!S.calMonth) S.calMonth={y:now.getFullYear(), m:now.getMonth()};
  const {y,m}=S.calMonth, first=new Date(y,m,1), start=(first.getDay()+6)%7, td=today();
  let cells='';
  for(let i=0;i<42;i++){
    const d=new Date(y,m,1-start+i), k=ymd(d), out=d.getMonth()!==m;
    if(i>=35 && out && d.getDate()<8) break;
    const marks=marksFor(k);
    cells+=`<button class="d ${out?'out':''} ${k<td?'past':''} ${k===td?'today':''} ${S.selDay===k?'sel':''}" data-day="${k}">${d.getDate()}${marks.length ? `<span class="dcount ${['o','g','r'].find(c => marks.includes(c)) || ''}">${marks.length}</span>` : `<span class="dots"></span>`}</button>`;
  }
  return `<div class="cal">
    <div class="ch"><button class="nav" data-cal="-1">‹</button><b>${t('months')[m]} ${y}</b><button class="nav" data-cal="1">›</button></div>
    <div class="grid">${t('wd').map(w=>`<div class="wd">${w}</div>`).join('')}${cells}</div>
    <div class="leg">${legend}</div>
  </div>`;
}
function dayBlock(jobs, cardFn){

}
function byDate(a,b){ return (a.date+(a.time||'')).localeCompare(b.date+(b.time||'')) }

function taken(jobId){ return S.signups.filter(s=>s.jobId===jobId && isActive(s)).length }
function shortName(n){ const p=String(n||'').split(' '); return p.length>1 ? p[0]+' '+p[p.length-1][0]+'.' : n }

const slotsOf = j => (j.times && j.times.length > 1) ? j.times : null;
const capacity = j => (+j.spots||0) * (slotsOf(j) ? slotsOf(j).length : 1);
const takenSlot = (jobId, slot) => S.signups.filter(s => s.jobId===jobId && isActive(s) && s.slot===slot).length;
const durText = j => (j.duration && +j.duration !== +j.hours) ? `<span class="m">⏱ ${t('lasts', esc(j.duration))}</span>` : '';
const timeText = j => slotsOf(j) ? slotsOf(j).join(' / ') : (j.time || '');
function jobCard(j, {mine}){
  const ppl = S.signups.filter(s=>s.jobId===j.id && isActive(s));
  const slots = slotsOf(j);
  const left = Math.max(0, capacity(j) - ppl.length);
  const past = j.date < today();
  let action, cls='';
  if (mine && mine.status==='done'){ cls='done'; action = `<span class="status g">${t('doneHrs', esc(mine.hours))}</span>` }
  else if (mine && mine.status==='failed'){ cls='failed'; action = `<span class="status r">${t('notDone')}</span>` }
  else if (mine){ cls='mine'; action = past ? `<span class="status y">${t('waitConfirm')}</span>`
                               : `<span class="status y">${t('registered')}${slots && mine.slot ? ' · 🕑 '+esc(mine.slot) : ''}</span><button class="btn sm out-r" data-unreg="${esc(mine.id)}">${t('cancel')}</button>` }
  else if (!past && slots && left>0) action = `<div class="slots"><span class="m">${t('chooseTime')}</span><div class="slotrow">${slots.map(tm => { const l = (+j.spots||0) - takenSlot(j.id, tm);
      return l>0 ? `<button class="slot" data-regslot="${esc(j.id)}" data-slot="${esc(tm)}"><b>${esc(tm)}</b><small>${t('slotLeft', l)}</small></button>`
                 : `<span class="slot full"><b>${esc(tm)}</b><small>${t('slotFull')}</small></span>` }).join('')}</div></div>`;
  else action = past ? `<span class="m">${t('happened')}</span>` : left>0 ? `<span class="m">${t('spotsLeft', left)}</span><button class="btn sm y" data-reg="${esc(j.id)}">${t('register')}</button>`
                       : `<span class="m">${t('noSpots')}</span>`;
  return `
  <div class="job ${cls}">
    <div class="head"><h3>${esc(j.title)}</h3><span class="hrs">+${esc(j.hours)} ${t('hrs')}</span></div>
    <div class="meta"><span class="y">📅 ${esc(fmtDate(j.date))}${timeText(j)?' · '+esc(timeText(j)):''}</span><span>📍 ${esc(j.place)}</span>${durText(j)}<span class="m">👤 ${esc(j.teacherName)}</span></div>
    ${j.task?`<div class="task">${esc(j.task)}</div>`:''}
    ${filesBlock(j)}
    ${ppl.length?`<div class="who2">👥 ${t('signedUpList', ppl.length, capacity(j))}: ${ppl.map(s=>`<span class="${s.studentKey===S.me.key?'y':''}">${esc(shortName(s.studentName))}${slots && s.slot ? ' ('+esc(s.slot)+')' : ''}</span>`).join(', ')}</div>`:''}
    <div class="foot">${action}</div>
    ${chatBlock(j)}
  </div>`;
}

  const meta = (p.date || p.time || p.place) ? `<div class="meta">${p.date ? `<span class="y">📅 ${esc(fmtDate(p.date))}${p.time ? ' · '+esc(p.time) : ''}</span>` : p.time ? `<span class="y">🕑 ${esc(p.time)}</span>` : ''}${p.place ? `<span>📍 ${esc(p.place)}</span>` : ''}</div>` : '';
  const del = S.confirmDelPost === p.id;
  let foot;
  if (mine) foot = `
    <div class="offers">🙋 ${offers.length ? `${t('hOffered')}: <b>${names}</b>` : `<span class="m">${t('hNoOffers')}</span>`}</div>
    <div class="foot" style="margin-top:10px;justify-content:flex-end">
      ${del ? `<span class="m">${t('hDelQ')}</span><button class="btn sm ghost" data-delpostno>${t('no')}</button><button class="btn sm" style="background:var(--r);color:#000" data-delpost="${esc(p.id)}">${t('yesDel')}</button>`
            : `<button class="btn sm out-g" data-resolve="${esc(p.id)}">${p.resolved ? '↺ '+t('hReopen') : '✓ '+t('hResolve')}</button><button class="linkbtn" data-delpostask="${esc(p.id)}">${t('del')}</button>`}
    </div>`;
  else foot = `<div class="foot" style="margin-top:4px">
      <span class="${myOffer ? 'status g' : 'm'}">${myOffer ? '✓ '+t('hYouHelp') : offers.length ? '🙋 '+t('hHelping')+': '+names : ''}</span>
      ${p.resolved ? '' : myOffer ? `<button class="btn sm out-r" data-unoffer="${esc(myOffer.id)}">${t('cancel')}</button>` : `<button class="btn sm g" data-offer="${esc(p.id)}">🙋 ${t('hCanHelp')}</button>`}
    </div>`;
  return `<div class="job ${mine ? 'own' : ''} ${p.resolved ? 'past' : ''}" id="post-${esc(p.id)}">
    <div class="head"><h3>${esc(p.title)}</h3>${mine ? `<span class="mine-tag">${t('hMine')}</span>` : p.resolved ? `<span class="mine-tag">✓ ${t('hResolved')}</span>` : ''}</div>
    <div class="author">👤 ${mine ? t('you') : esc(p.authorName)} · ${ago(p.at)}</div>
    ${meta}
    ${p.body ? `<div class="task">${esc(p.body)}</div>` : ''}
    ${foot}
  </div>`;
}
function helpMain(){

function teacherCard(j){

  const del = S.confirmDel===j.id;
  const failed = ppl.filter(s=>s.status==='failed');

  return `
  <div class="job ${j.completed?'done':isPast && !pend.length?'past':''}">
    <div class="head"><h3>${esc(j.title)}</h3><span class="hrs">+${esc(j.hours)} ${t('hrs')}</span></div>
    ${j.completed ? `<div class="donebar"><span>✓ ${t('jobCompleted')}</span><button class="btn sm out-g" data-hide="${esc(j.id)}">${t('hideBtn')}</button></div>` : ''}
    <div class="meta"><span class="y">📅 ${esc(fmtDate(j.date))}${timeText(j)?' · '+esc(timeText(j)):''}</span><span>📍 ${esc(j.place)}</span>${durText(j)}<span class="m">👥 ${t('nSignedUp', taken(j.id), capacity(j))}</span></div>
    ${slots ? `<div class="slotsum">${slots.map(tm=>`<span>🕑 ${esc(tm)} <b>${takenSlot(j.id,tm)}/${esc(j.spots)}</b></span>`).join('')}</div>` : ''}
    ${j.task?`<div class="task">${esc(j.task)}</div>`:''}
    ${filesBlock(j)}
    <div class="ppl">
      ${ppl.length ? ppl.map(s=>`
        <div class="p ${s.status==='done'?'ok':s.status==='failed'?'bad':''}">
          <span><span class="nm">${s.status==='done'?'✓ ':s.status==='failed'?'✕ ':''}${esc(s.studentName)}</span>
            <small class="m">${slots && s.slot ? '🕑 '+esc(s.slot)+' · ' : ''}${s.status==='done'?t('jobDone', esc(s.hours)):s.status==='failed'?t('jobFailed'):t('signedAgo', ago(s.at))}</small></span>
          <span class="acts">${s.status==='registered'
            ? `<button class="btn sm out-g" data-ok="${esc(s.id)}">${t('btnDone')}</button><button class="btn sm out-r" data-fail="${esc(s.id)}">${t('btnFail')}</button>`
            : `<button class="linkbtn" data-undo="${esc(s.id)}">${t('change')}</button>`}
          </span>
        </div>`).join('') : `<span class="m" style="font-size:14px">${t('nobody')}</span>`}
      ${pend.length>1 ? `<div style="text-align:right;margin-top:4px"><button class="btn sm g" data-okall="${esc(j.id)}">${t('allDone')}</button></div>`:''}
    </div>
    ${failed.length > (+j.relistedCount||0) ? `<div class="relist"><span>${t('relistQ', failed.length)}</span><button class="btn sm y" data-relist="${esc(j.id)}">${t('relistBtn')}</button></div>`:''}
    ${chatBlock(j)}
    <div class="foot" style="margin-top:10px;justify-content:flex-end">
      ${del ? `<span class="m">${ppl.some(s=>s.status==='done') ? t('delQDone') : t('delQ')}</span><button class="btn sm ghost" data-delno>${t('no')}</button><button class="btn sm" style="background:var(--r);color:#000" data-delyes="${esc(j.id)}">${t('yesDel')}</button>`
            : `<button class="linkbtn" data-del="${esc(j.id)}">${t('del')}</button>`}
    </div>
  </div>`;
}

function otherCard(j){

const timeRow = tm => `<div class="trow"><input type="time" name="times" value="${esc(tm||'')}" required><button type="button" class="linkbtn" data-rmtime title="✕">✕</button></div>`;

/* --- Veiksmai --- */
async function act(fn, okMsg){
  try{ await fn(); if(okMsg) toast(okMsg); await loadAll() }catch(e){ toast(errMsg(e)); await loadAll() }
}
function bindView(){
  const on = (sel, fn) => document.querySelectorAll(sel).forEach(b=>b.onclick=()=>fn(b));
  on('[data-seen]', () => { S.seenAt = Date.now(); S.lastN = 0; renderApp();
    sb.from('profiles').update({ seen_at: new Date(S.seenAt).toISOString() }).eq('id', S.me.key).then(()=>{}) });
  on('[data-goto]', b => {
    const j = S.jobs.find(x=>x.id===b.dataset.goto); if (!j) return;
    if ((S.me.role==='student' && j.completed) || (S.me.role==='teacher' && j.teacherHidden)){ const h=document.getElementById('hist'); h && h.scrollIntoView({behavior:'smooth'}); return }
    S.selDay = j.date; const d=new Date(j.date+'T00:00'); S.calMonth={y:d.getFullYear(), m:d.getMonth()};
    if (b.dataset.gochat) S.openChat[j.id] = true;
    renderApp(); const el = document.querySelector('[data-dayclear]'); el && el.scrollIntoView({behavior:'smooth', block:'start'});
    if (b.dataset.gochat){ const i=document.querySelector(`[data-keep="chat-${j.id}"]`); i && i.focus({preventScroll:true}) }
  });
  on('[data-cal]', b => { const c=S.calMonth, d=new Date(c.y, c.m + +b.dataset.cal, 1); S.calMonth={y:d.getFullYear(), m:d.getMonth()}; renderApp() });
  on('[data-day]', b => { const k=b.dataset.day; S.selDay = S.selDay===k ? null : k; const d=new Date(k+'T00:00'); S.calMonth={y:d.getFullYear(), m:d.getMonth()}; renderApp() });
  on('[data-dayclear]', () => { S.selDay=null; renderApp() });
  on('[data-chat]', b => { const id=b.dataset.chat; S.openChat[id] = !S.openChat[id]; renderApp(); if (S.openChat[id]){ const el=document.querySelector(`[data-keep="chat-${id}"]`); el && el.focus() } });
  document.querySelectorAll('[data-draft]').forEach(i => i.oninput = () => { S.drafts[i.dataset.draft] = i.value });
  document.querySelectorAll('[data-send]').forEach(f => f.onsubmit = async ev => {
    ev.preventDefault();
    const jobId = f.dataset.send, inp = f.querySelector('input'), text = inp.value.trim();
    if (!text) return;
    S.drafts[jobId] = ''; inp.value = '';
    try{ await q(sb.from('messages').insert({ job_id:jobId, text, author_id:S.me.key })); await loadAll() }
    catch(e){ S.drafts[jobId] = text; renderApp(); toast(errMsg(e)) }
  });
  on('[data-reg]', b => {
    const j = S.jobs.find(x=>x.id===b.dataset.reg); if(!j) return;
    if (taken(j.id) >= capacity(j)) return toast(t('noSpots'));
    b.disabled = true;
    act(() => q(sb.from('signups').insert({ job_id:j.id, student_id:S.me.key })), t('tRegistered'));
  });
  on('[data-regslot]', b => {
    const j = S.jobs.find(x=>x.id===b.dataset.regslot), slot = b.dataset.slot; if(!j) return;
    if (takenSlot(j.id, slot) >= +j.spots) return toast(t('noSpots'));
    document.querySelectorAll(`[data-regslot="${j.id}"]`).forEach(x => x.disabled = true);
    act(() => q(sb.from('signups').insert({ job_id:j.id, student_id:S.me.key, slot })), t('tRegisteredSlot', slot));
  });
  on('[data-unreg]', b => { b.disabled=true; act(() => q(sb.from('signups').delete().eq('id', b.dataset.unreg)), t('tUnreg')) });
  on('#openNew', () => { S.newOpen = true; S.prefill = null; S.newFiles = []; renderApp(); $('#newJob input[name=title]').focus() });
  on('#cancelNew', () => { S.newOpen = false; S.prefill = null; S.newFiles = []; renderApp() });
  renderFileList();
  syncTimes();
  const durIn = $('#durIn'), getIn = $('#getIn');
  if (durIn && getIn){
    let linked = getIn.value === durIn.value;
    durIn.oninput = () => { if (linked) getIn.value = durIn.value };
    getIn.oninput = () => { linked = getIn.value === durIn.value };
  }
  const at = $('#addTime');
  if (at) at.onclick = () => {
    const ins = [...document.querySelectorAll('#timeList input')], last = ins.length ? ins[ins.length-1].value : '13:00';
    let [h, m] = (last || '13:00').split(':').map(Number); h = Math.min(23, (h||0) + 1);
    $('#timeList').insertAdjacentHTML('beforeend', timeRow(String(h).padStart(2,'0') + ':' + String(m||0).padStart(2,'0')));
    syncTimes(); const all = document.querySelectorAll('#timeList input'); all[all.length-1].focus();
  };
  const fi = $('#fileInput');
  if (fi) fi.onchange = () => {
    const kept = (S.prefill && S.prefill.files) || [], err = $('#jobErr'); err.textContent = '';
    for (const f of fi.files){
      if (kept.length + S.newFiles.length >= MAX_FILES){ err.textContent = t('errTooMany'); break }
      if (f.size > MAX_MB*1048576 && !/^image\//.test(fileType(f))){ err.textContent = t('errTooBig', f.name); continue }
      if (!fileType(f)){ err.textContent = t('errType', f.name); continue }
      S.newFiles.push(f);
    }
    fi.value = ''; renderFileList();
  };
  on('[data-relist]', b => {
    const j = S.jobs.find(x=>x.id===b.dataset.relist); if (!j) return;
    const nFail = S.signups.filter(s=>s.jobId===j.id && s.status==='failed').length;
    S.prefill = { fromJobId:j.id, failedCount:nFail, files:[...(j.files||[])], title:j.title, place:j.place, time:j.time, times:[...(j.times && j.times.length ? j.times : (j.time ? [j.time] : []))], hours:j.hours, duration:j.duration, task:j.task, spots:nFail || j.spots, date: plusDays(1) };
    S.newOpen = true; S.selDay = null; S.newFiles = []; renderApp();
    const f = $('#newJob'); f.scrollIntoView({behavior:'smooth', block:'start'}); f.querySelector('[name=date]').focus();
  });
  const nf = $('#newJob');
  if (nf) nf.onsubmit = async ev => {
    ev.preventDefault();
    const f = new FormData(nf), btn = nf.querySelector('button:not([type=button])');
    btn.disabled = true;
    const times = [...new Set(f.getAll('times').filter(Boolean))].sort();
    const job = { title:f.get('title').trim(), place:f.get('place').trim(), date:f.get('date'), time:times[0]||'', times,
      hours:+f.get('hours'), duration:+f.get('duration'), spots:+f.get('spots'), task:(f.get('task')||'').trim(), teacher_id:S.me.key };
    const p = S.prefill;
    try{
      if (S.newFiles.length) btn.textContent = t('uploading');
      const uploaded = await uploadFiles(S.newFiles);
      job.attachments = [...((p && p.files) || []), ...uploaded];
      await q(sb.from('jobs').insert(job));
      S.newFiles = [];
      if (p && p.fromJobId) await q(sb.from('jobs').update({ relisted_count: p.failedCount }).eq('id', p.fromJobId));
      S.newOpen=false; S.prefill=null; document.activeElement.blur(); toast(p ? t('tRepublished') : t('tPublished')); await loadAll(); renderApp();
    }catch(e){ $('#jobErr').textContent = /mime|type/i.test(String(e&&e.message)) ? t('errType','') : /size|large/i.test(String(e&&e.message)) ? t('errTooBig','') : errMsg(e); btn.disabled=false; btn.textContent = t('publish') }
  };
  const setStatus = (id, status) => q(sb.from('signups').update({ status }).eq('id', id));
  const askIfDone = jobId => { const j = S.jobs.find(x=>x.id===jobId); if (j && j.completed && !j.teacherHidden && !S.asked[jobId]){ S.asked[jobId]=1; S.askHide = jobId; renderApp() } };
  on('[data-ok]',   b => { const sg=S.signups.find(x=>x.id===b.dataset.ok); b.disabled=true; act(()=>setStatus(b.dataset.ok,'done'), t('tDone')).then(()=> sg && askIfDone(sg.jobId)) });
  on('[data-fail]', b => { b.disabled=true; act(()=>setStatus(b.dataset.fail,'failed'), t('tFail')) });
  on('[data-undo]', b => { b.disabled=true; act(()=>setStatus(b.dataset.undo,'registered')) });
  on('[data-okall]', b => { const jid=b.dataset.okall; b.disabled=true; act(() => q(sb.from('signups').update({ status:'done' }).eq('job_id', jid).eq('status','registered')), t('tAll')).then(()=>askIfDone(jid)) });
  on('[data-hideno]', () => { S.askHide = null; renderApp() });
  on('[data-stats]', () => { S.statsOpen = true; renderApp() });
  on('[data-ttab]', b => { S.ttab = b.dataset.ttab; S.selDay = null; renderApp(); window.scrollTo({ top:0 }) });
  on('[data-gohelp]', b => { S.ttab = 'help'; const p = S.tposts.find(x=>x.id===b.dataset.gohelp); if (p && p.resolved) S.resolvedOpen = true; renderApp();
    const el = document.getElementById('post-' + b.dataset.gohelp); el && el.scrollIntoView({ behavior:'smooth', block:'center' }) });
  on('#openHelp', () => { S.helpOpen = true; renderApp(); const i = $('#newHelp input[name=title]'); i && i.focus() });
  on('#cancelHelp', () => { S.helpOpen = false; renderApp() });
  const hf = $('#newHelp');
  if (hf) hf.onsubmit = async ev => {
    ev.preventDefault();
    const f = new FormData(hf), btn = hf.querySelector('button:not([type=button])'); btn.disabled = true;
    const post = { title:(f.get('title')||'').trim(), body:(f.get('body')||'').trim(), date:f.get('date') || null, time:f.get('time') || '', place:(f.get('place')||'').trim(), author_id:S.me.key };
    try{ await q(sb.from('teacher_posts').insert(post)); S.helpOpen = false; document.activeElement.blur(); toast(t('tHelpPosted')); await loadAll(); renderApp() }
    catch(e){ $('#helpErr').textContent = errMsg(e); btn.disabled = false }
  };
  on('[data-offer]', b => { b.disabled = true; act(() => q(sb.from('teacher_offers').insert({ post_id:b.dataset.offer, teacher_id:S.me.key })), t('tOffered')) });
  on('[data-unoffer]', b => { b.disabled = true; act(() => q(sb.from('teacher_offers').delete().eq('id', b.dataset.unoffer)), t('tUnoffered')) });
  on('[data-resolve]', b => { const p = S.tposts.find(x=>x.id===b.dataset.resolve); if (!p) return; b.disabled = true;
    act(() => q(sb.from('teacher_posts').update({ resolved: !p.resolved }).eq('id', p.id)), p.resolved ? null : t('tResolved')) });
  on('[data-delpostask]', b => { S.confirmDelPost = b.dataset.delpostask; renderApp() });
  on('[data-delpostno]', () => { S.confirmDelPost = null; renderApp() });
  on('[data-delpost]', b => { const id = b.dataset.delpost; S.confirmDelPost = null; act(() => q(sb.from('teacher_posts').delete().eq('id', id)), t('tHelpDeleted')) });
  on('[data-collresolved]', () => { S.resolvedOpen = !S.resolvedOpen; renderApp() });
  on('[data-statsclose]', () => { S.statsOpen = false; renderApp() });
  on('[data-collhours]', () => { S.hoursOpen = !S.hoursOpen; try{ localStorage.setItem('socialy_hours_open', S.hoursOpen ? '1' : '0') }catch(e){} renderApp() });
  on('[data-hide]', b => { const id=b.dataset.hide; S.askHide=null; b.disabled=true; act(() => q(sb.from('jobs').update({ teacher_hidden:true }).eq('id', id)), t('tHidden')) });
  on('[data-del]', b => { S.confirmDel = b.dataset.del; renderApp() });
  on('[data-delno]', () => { S.confirmDel = null; renderApp() });
  on('[data-delyes]', b => { const id=b.dataset.delyes; S.confirmDel=null;
    // jei kas nors jau gavo valandas – darbas tik paslepiamas, kad valandos neišnyktų
    const hasDone = S.signups.some(s=>s.jobId===id && s.status==='done');
    const job = S.jobs.find(x=>x.id===id), others = new Set(S.jobs.filter(x=>x.id!==id).flatMap(x=>x.files.map(f=>f.path)));
    const orphan = ((job && job.files) || []).map(f=>f.path).filter(p=>!others.has(p) && p.startsWith(S.me.key+'/'));
    act(async () => { if (hasDone) await q(sb.from('jobs').update({ teacher_hidden:true, completed:true }).eq('id', id));
      else { await q(sb.from('jobs').delete().eq('id', id)); if (orphan.length) await sb.storage.from(BUCKET).remove(orphan) } }, t('tDeleted')) });
}

/* ---------- Paleidimas ---------- */
(async function init(){
  document.documentElement.lang = LANG;
  if (!CONFIGURED){ renderAuth(); return }
  $('#app').innerHTML = `<div class="auth"><div class="hero">${LOGO(true)}<p class="sub" style="margin-top:24px">${t('loading')}</p></div></div>`;
  sb.auth.onAuthStateChange((event, session) => {
    if (event === 'PASSWORD_RECOVERY'){ S.authMode = 'recovery'; S.me = null; renderAuth(); return }
    if (S.authMode === 'recovery') return;
    if (session && session.user){ setTimeout(() => startSession(session.user), 0) }
    else if (event === 'SIGNED_OUT' && S.me){ logout() }
  });
  const { data:{ session } } = await sb.auth.getSession();
  if (location.hash.includes('type=recovery')) return;
  if (session) startSession(session.user); else renderAuth();
})();
</script>
</body>
</html>
